spring:
  application:
    name: agent-program
  profiles:
    active: local
  ai:
    dashscope:
      api-key: ${ai.dashscope.api-key}
      chat:
        options:
          model: qwen-flash
      # PgVectorStore 的 vector_store 表为 vector(1536)，需让向量模型输出 1536 维
      # （text-embedding-v3 只支持 1024/768/512，text-embedding-v4 才支持 1536）
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 1536
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3.5:4b
#    vectorstore:
#      pgvector:
#        index-type: HNSW
#        dimensions: 1536
#        distance-type: COSINE_DISTANCE
#        max-document-batch-size: 10000
  datasource:
    url: ${datasource.url}
    username: ${datasource.username}
    password: ${datasource.password}


server:
  port: 8080
  servlet:
    context-path: /api

# springdoc-openapi\u9879\u76EE\u914D\u7F6E
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.xia.agentprogram.controller

# knife4j\u7684\u589E\u5F3A\u914D\u7F6E\uFF0C\u4E0D\u9700\u8981\u589E\u5F3A\u53EF\u4EE5\u4E0D\u914D
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug

search-api:
  api-key: ${search-api.apiKey}
